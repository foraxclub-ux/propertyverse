<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | PropertyVerse</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(rgba(8,27,51,.78),rgba(8,27,51,.78)),
  url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
}

header{
  background:#081B33;
  padding:16px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#FFD700;
  font-size:25px;
  font-weight:bold;
}

.home{
  color:white;
  text-decoration:none;
}

.register-box{
  width:400px;
  max-width:92%;
  background:white;
  margin:35px auto;
  padding:32px 30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.register-box h1{
  text-align:center;
  color:#081B33;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.register-btn{
  width:100%;
  margin-top:22px;
  padding:14px;
  background:#E63946;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  text-align:center;
  margin-top:20px;
  color:#666;
}

.login a{
  color:#E63946;
  font-weight:bold;
  text-decoration:none;
}

footer{
  text-align:center;
  color:white;
  padding:15px;
  background:#050F1F;
  margin-top:auto;
}
</style>
</head>

<body>

<header>

<div class="logo">
🏠 PropertyVerse
</div>

<a href="index.html" class="home">
← Home
</a>

</header>


<div class="register-box">

<h1>📝 Create Account</h1>

<p class="subtitle">
Join PropertyVerse today
</p>


<form>

<label>👤 Full Name</label>

<input
type="text"
placeholder="Enter your full name"
required
>


<label>📱 Mobile Number</label>

<input
type="tel"
placeholder="Enter mobile number"
required
>


<label>📧 Email Address</label>

<input
type="email"
placeholder="Enter email address"
required
>


<label>👔 I am a</label>

<select required>

<option value="">
Select account type
</option>

<option>
Buyer
</option>

<option>
Seller
</option>

<option>
Agent
</option>

</select>


<label>🔐 Password</label>

<input
type="password"
placeholder="Create a password"
required
>


<label>🔐 Confirm Password</label>

<input
type="password"
placeholder="Confirm password"
required
>


<button
type="button"
class="register-btn"
onclick="window.location.href='dashboard.html'"
>
Create Account
</button>

</form>


<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>


<footer>

© 2026 PropertyVerse. All Rights Reserved.

</footer>

</body>
</html>

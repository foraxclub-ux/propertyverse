<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | BharatWorld Properties</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;

background:
linear-gradient(
rgba(8,27,51,.78),
rgba(8,27,51,.78)
),
url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

display:flex;
flex-direction:column;
}

header{
background:#081B33;
padding:16px 25px;

display:flex;
justify-content:space-between;
align-items:center;

flex-wrap:wrap;
gap:15px;
}

.logo{
color:#FFD700;
font-size:25px;
font-weight:bold;
}

.logo small{
display:block;
color:white;
font-size:10px;
letter-spacing:2px;
margin-top:3px;
}

.home{
color:white;
text-decoration:none;
padding:9px 14px;
border-radius:6px;
}

.home:hover{
background:#E63946;
}

.register-box{
width:400px;
max-width:92%;

background:white;

margin:35px auto;

padding:35px 30px;

border-radius:16px;

box-shadow:
0 10px 30px
rgba(0,0,0,.25);
}

.register-box h1{
text-align:center;
color:#081B33;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
margin:15px 0 7px;
}

input{
width:100%;
padding:13px;

border:1px solid #ddd;

border-radius:7px;

font-size:15px;

outline:none;
}

input:focus{
border-color:#E63946;
}

.register-btn{
width:100%;

margin-top:22px;

padding:14px;

background:#E63946;

color:white;

border:0;

border-radius:8px;

font-size:16px;

font-weight:bold;

cursor:pointer;
}

.register-btn:hover{
background:#c92f3b;
}

.message{
display:none;

margin-top:18px;

padding:12px;

border-radius:7px;

text-align:center;

font-weight:bold;
}

.error{
background:#ffe8e8;
color:#c62828;
}

.success{
background:#e7f8ed;
color:#16803c;
}

.login{
text-align:center;
margin-top:22px;
color:#666;
}

.login a{
color:#E63946;
font-weight:bold;
text-decoration:none;
}

footer{
text-align:center;
color:white;

padding:15px;

background:#050F1F;

margin-top:auto;
}

@media(max-width:500px){

header{
justify-content:center;
text-align:center;
}

.register-box{
margin:35px auto;
padding:30px 22px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">

🏠 BharatWorld

<small>PROPERTIES</small>

</div>


<a href="index.html" class="home">

← Home

</a>

</header>



<div class="register-box">


<h1>📝 Create Account</h1>


<p class="subtitle">

Join BharatWorld Properties today

</p>


<form id="registerForm">


<label>
👤 Full Name
</label>


<input
id="name"
type="text"
placeholder="Enter your full name"
required
>


<label>
📧 Email
</label>


<input
id="email"
type="email"
placeholder="Enter your email"
required
>


<label>
🔑 Password
</label>


<input
id="password"
type="password"
placeholder="Create a password"
minlength="4"
required
>


<button
type="submit"
class="register-btn"
>

Create Account

</button>


<div
id="errorMessage"
class="message error"
>
</div>


<div
id="successMessage"
class="message success"
>
</div>


</form>



<div class="login">

Already have an account?

<a href="login.html">

Login

</a>

</div>


</div>



<footer>

© 2026 BharatWorld Properties. All Rights Reserved.

</footer>



<script>

/* =========================================
   BHARATWORLD PROPERTIES
   REGISTER SYSTEM
========================================= */


/* =========================================
   MIGRATE OLD USER DATA
========================================= */

function migrateOldUser(){

let users = [];

try{

users =
JSON.parse(
localStorage.getItem("users") || "[]"
);

}catch(error){

users = [];

}


/*
   Agar users system empty hai
   lekin purana pv_email data available hai
*/

if(
users.length === 0 &&
localStorage.getItem("pv_email")
){

const oldEmail =
localStorage
.getItem("pv_email")
.trim()
.toLowerCase();

const oldName =
localStorage
.getItem("pv_name") ||
"Existing User";

const oldPassword =
localStorage
.getItem("pv_password") ||
"";


if(oldEmail !== ""){

const oldUser = {

id:
"USR" + Date.now(),

name:
oldName,

email:
oldEmail,

password:
oldPassword,

phone:
"",

role:
"user",

status:
"active",

registeredAt:
new Date().toLocaleString("en-IN")

};


users.push(oldUser);


localStorage.setItem(
"users",
JSON.stringify(users)
);

}

}

}


/* Run migration */

migrateOldUser();



/* =========================================
   REGISTER FORM
========================================= */

document
.getElementById("registerForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();


/* =========================================
   FORM VALUES
========================================= */

const name =
document
.getElementById("name")
.value
.trim();


const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();


const password =
document
.getElementById("password")
.value;


const errorMessage =
document
.getElementById("errorMessage");


const successMessage =
document
.getElementById("successMessage");


/* =========================================
   RESET MESSAGES
========================================= */

errorMessage.style.display =
"none";

successMessage.style.display =
"none";



/* =========================================
   VALIDATION
========================================= */

if(
name === "" ||
email === "" ||
password === ""
){

errorMessage.innerText =
"⚠️ Please fill all fields.";

errorMessage.style.display =
"block";

return;

}


if(password.length < 4){

errorMessage.innerText =
"⚠️ Password must contain at least 4 characters.";

errorMessage.style.display =
"block";

return;

}



/* =========================================
   GET USERS
========================================= */

let users = [];

try{

users =
JSON.parse(
localStorage.getItem("users") || "[]"
);

}catch(error){

users = [];

}



/* =========================================
   CHECK DUPLICATE EMAIL
========================================= */

const existingUser =
users.find(
function(user){

return (
user &&
String(user.email || "")
.toLowerCase()
.trim() === email
);

}
);


if(existingUser){

errorMessage.innerText =
"⚠️ This email is already registered. Please login.";

errorMessage.style.display =
"block";

return;

}



/* =========================================
   CREATE USER
========================================= */

const newUser = {

id:
"USR" + Date.now(),

name:
name,

email:
email,

password:
password,

phone:
"",

role:
"user",

status:
"active",

registeredAt:
new Date().toLocaleString("en-IN")

};



/* =========================================
   ADD USER
========================================= */

users.push(newUser);



/* =========================================
   SAVE MAIN USER DATABASE
========================================= */

localStorage.setItem(
"users",
JSON.stringify(users)
);



/* =========================================
   BACKUP USER DATABASE
========================================= */

localStorage.setItem(
"pv_users",
JSON.stringify(users)
);



/* =========================================
   OLD LOGIN SYSTEM
========================================= */

localStorage.setItem(
"pv_name",
name
);

localStorage.setItem(
"pv_email",
email
);

localStorage.setItem(
"pv_password",
password
);

localStorage.setItem(
"pv_logged_in",
"false"
);



/* =========================================
   SUCCESS MESSAGE
========================================= */

successMessage.innerText =
"✅ Account created successfully! Redirecting to login...";

successMessage.style.display =
"block";



/* =========================================
   DISABLE BUTTON
========================================= */

const button =
document.querySelector(
".register-btn"
);

button.disabled = true;

button.style.opacity =
"0.7";



/* =========================================
   REDIRECT LOGIN
========================================= */

setTimeout(
function(){

window.location.href =
"login.html";

},
1500
);


}
);

</script>


</body>

</html>

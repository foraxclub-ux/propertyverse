<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | PropertyVerse</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(rgba(8,27,51,.78),rgba(8,27,51,.78)),
  url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
  background-position:center;
  display:flex;
  flex-direction:column;
}

header{
  background:#081B33;
  padding:16px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#FFD700;
  font-size:25px;
  font-weight:bold;
}

.home{
  color:white;
  text-decoration:none;
}

.login-box{
  width:360px;
  max-width:92%;
  background:white;
  margin:auto;
  padding:35px 30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.login-box h1{
  text-align:center;
  color:#081B33;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.login-btn{
  width:100%;
  margin-top:22px;
  padding:14px;
  background:#E63946;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.register{
  text-align:center;
  margin-top:22px;
  color:#666;
}

.register a{
  color:#E63946;
  font-weight:bold;
  text-decoration:none;
}

footer{
  text-align:center;
  color:white;
  padding:15px;
  background:#050F1F;
}

@media(max-width:500px){
  .login-box{
    margin:35px auto;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
🏠 PropertyVerse
</div>

<a href="index.html" class="home">
← Home
</a>

</header>


<div class="login-box">

<h1>🔐 Login</h1>

<p class="subtitle">
Welcome back to PropertyVerse
</p>

<form>

<label>📧 Email or Mobile</label>

<input
type="text"
placeholder="Enter email or mobile"
required
>


<label>🔑 Password</label>

<input
type="password"
placeholder="Enter password"
required
>


<button
type="button"
class="login-btn"
onclick="window.location.href='dashboard.html'">
Login
</button>

</form>


<div class="register">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>

</div>


<footer>

© 2026 PropertyVerse. All Rights Reserved.

</footer>

</body>
</html>

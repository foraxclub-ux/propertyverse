<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | BharatWorld Properties</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f7fa;
    color:#222;
}

.header{
    background:#0b1f3a;
    color:white;
    padding:18px 20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:430px;
    margin:50px auto;
    padding:20px;
}

.login-box{
    background:white;
    padding:30px 25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.10);
}

.login-box h2{
    text-align:center;
    margin-top:0;
    color:#0b1f3a;
}

.login-box p{
    text-align:center;
    color:#666;
    font-size:14px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#0b1f3a;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:8px;
    background:#0b1f3a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.92;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#0b1f3a;
    font-weight:bold;
    text-decoration:none;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#555;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:40px;
    padding:20px;
    color:#777;
    font-size:13px;
}

.footer a{
    color:#555;
    text-decoration:none;
    margin:0 4px;
}
</style>
</head>

<body>

<div class="header">
    <h1>BharatWorld Properties</h1>
    <p>From Bharat to the World</p>
</div>

<div class="container">

    <div class="login-box">

        <h2>Login</h2>

        <p>Login to access your BharatWorld Properties account.</p>

        <form id="loginForm">

            <label for="loginValue">
                Email or Mobile
            </label>

            <input
                type="text"
                id="loginValue"
                placeholder="Enter email or mobile"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <div class="back">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</div>

<div class="footer">

    <p>
        © 2026 BharatWorld Properties
    </p>

    <p>
        <a href="index.html">Home</a> |
        <a href="contact.html">Contact</a> |
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms & Conditions</a> |
        <a href="disclaimer.html">Disclaimer</a>
    </p>

</div>


<script>

/* =====================================================
   ALREADY LOGGED-IN USER CHECK
   ===================================================== */

(function(){

    const isLoggedIn =
        localStorage.getItem("pv_logged_in") === "true";

    const currentUser =
        localStorage.getItem("pv_current_user") || "";

    const currentUserId =
        localStorage.getItem("pv_current_user_id") || "";

    /*
       Agar user already login hai,
       to Login page dobara mat dikhao.
       Direct Dashboard par bhejo.
    */

    if(
        isLoggedIn &&
        (
            currentUser.trim() !== "" ||
            currentUserId.trim() !== ""
        )
    ){

        window.location.replace("dashboard.html");

    }

})();


/* =====================================================
   LOGIN SYSTEM
   ===================================================== */

document.getElementById("loginForm").addEventListener(
    "submit",
    function(e){

        e.preventDefault();

        const loginValue =
            document.getElementById("loginValue")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;

        const message =
            document.getElementById("message");


        if(!loginValue || !password){

            message.style.color = "red";
            message.innerText =
                "Please enter Email/Mobile and Password.";

            return;
        }


        /* Get users */

        let users = [];

        try{

            users =
                JSON.parse(
                    localStorage.getItem("users")
                ) || [];

        }catch(error){

            users = [];

        }


        /*
           Normalize email/mobile
        */

        const loginNormalized =
            loginValue
            .toLowerCase()
            .replace(/\s+/g,"");


        /*
           Find user
        */

        let user = users.find(function(u){

            const email =
                String(u.email || "")
                .toLowerCase()
                .replace(/\s+/g,"");

            const phone =
                String(u.phone || "")
                .replace(/\s+/g,"");

            return(
                email === loginNormalized ||
                phone === loginNormalized
            );

        });


        /*
           Legacy account support
        */

        if(!user){

            const oldEmail =
                (
                    localStorage.getItem("pv_email") || ""
                )
                .toLowerCase()
                .replace(/\s+/g,"");

            const oldPassword =
                localStorage.getItem("pv_password") || "";

            if(
                loginNormalized === oldEmail &&
                password === oldPassword
            ){

                user = {

                    id:"LEGACY_USER",

                    name:
                        localStorage.getItem("pv_name") ||
                        "User",

                    email:
                        localStorage.getItem("pv_email") ||
                        loginValue,

                    phone:"",

                    password:oldPassword,

                    role:"user",

                    status:"active"

                };

            }

        }


        /*
           User not found
        */

        if(!user){

            message.style.color = "red";

            message.innerText =
                "❌ Invalid Email/Mobile or Password.";

            return;

        }


        /*
           Password check
        */

        if(String(user.password) !== String(password)){

            message.style.color = "red";

            message.innerText =
                "❌ Incorrect Password.";

            return;

        }


        /*
           Account status check
        */

        if(
            user.status &&
            String(user.status).toLowerCase() !== "active"
        ){

            message.style.color = "red";

            message.innerText =
                "❌ Your account is not active.";

            return;

        }


        /*
           SAVE LOGIN SESSION
        */

        localStorage.setItem(
            "pv_logged_in",
            "true"
        );

        localStorage.setItem(
            "pv_current_user",
            user.email || loginValue
        );

        localStorage.setItem(
            "pv_current_user_id",
            String(user.id || "")
        );

        localStorage.setItem(
            "pv_name",
            user.name || ""
        );

        localStorage.setItem(
            "pv_email",
            user.email || loginValue
        );


        /*
           Success message
        */

        message.style.color = "green";

        message.innerText =
            "✅ Login Successful! Redirecting...";


        /*
           Dashboard
        */

        setTimeout(function(){

            window.location.replace(
                "dashboard.html"
            );

        },700);

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | PropertyVerse</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fa;
  color:#081B33;
}

header{
  background:#081B33;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.logo{
  color:#FFD700;
  font-size:26px;
  font-weight:bold;
}

nav a{
  color:white;
  text-decoration:none;
  margin:8px;
}

.container{
  min-height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px 20px;
}

.login-box{
  background:white;
  width:100%;
  max-width:430px;
  padding:35px;
  border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.login-box h1{
  text-align:center;
  color:#081B33;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.login-btn{
  width:100%;
  padding:14px;
  margin-top:25px;
  background:#E63946;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

.register{
  text-align:center;
  margin-top:20px;
}

.register a{
  color:#E63946;
  text-decoration:none;
  font-weight:bold;
}

footer{
  background:#050F1F;
  color:white;
  text-align:center;
  padding:30px 20px;
}
</style>
</head>

<body>

<header>

<div class="logo">🏠 PropertyVerse</div>

<nav>
<a href="index.html">Home</a>
<a href="buy.html">Buy</a>
<a href="sell.html">Sell</a>
<a href="rent.html">Rent</a>
<a href="listing.html">Listing</a>
<a href="contact.html">Contact</a>
</nav>

</header>


<div class="container">

<div class="login-box">

<h1>Welcome Back 👋</h1>

<p class="subtitle">
Login to your PropertyVerse account
</p>

<form>

<label>Email or Mobile Number</label>

<input
type="text"
placeholder="Enter email or mobile number"
required
>

<label>Password</label>

<input
type="password"
placeholder="Enter password"
required
>

<button type="submit" class="login-btn">
🔐 Login
</button>

</form>

<div class="register">

<p>
Don't have an account?
<a href="register.html">Create Account</a>
</p>

</div>

</div>

</div>


<footer>

<h2 style="color:#FFD700;">PropertyVerse</h2>

<p style="margin-top:10px;">
Buy • Sell • Rent • Interior
</p>

<p style="margin-top:15px;">
© 2026 PropertyVerse. All Rights Reserved.
</p>

</footer>

</body>
</html>

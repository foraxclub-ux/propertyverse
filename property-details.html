<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Property Details | BharatWorld Properties</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#081B33;
}

header{
    background:#081B33;
    color:white;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

.logo{
    color:#FFD700;
    font-size:24px;
    font-weight:bold;
}

.logo small{
    display:block;
    color:white;
    font-size:10px;
    letter-spacing:2px;
    margin-top:3px;
}

nav{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:9px 11px;
    border-radius:6px;
}

nav a:hover{
    background:#E63946;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:0 20px 70px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#081B33;
    text-decoration:none;
    font-weight:bold;
}

.property-box{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 6px 25px rgba(0,0,0,.12);
}

.property-image{
    width:100%;
    height:430px;
    object-fit:cover;
}

.content{
    padding:30px;
}

.verified{
    display:inline-block;
    background:#e7f8ed;
    color:#16803c;
    padding:7px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
}

h1{
    font-size:32px;
    margin:15px 0 10px;
}

.price{
    color:#E63946;
    font-size:28px;
    font-weight:bold;
    margin:10px 0 20px;
}

.info{
    color:#555;
    line-height:2;
    font-size:17px;
}

.description{
    margin-top:25px;
    padding-top:25px;
    border-top:1px solid #ddd;
}

.description h2{
    margin-bottom:10px;
}

.description p{
    color:#666;
    line-height:1.7;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
}

.btn{
    display:inline-block;
    padding:13px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.call{
    background:#081B33;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.back-list{
    background:#E63946;
    color:white;
}

.no-property{
    background:white;
    padding:50px 20px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.no-property h2{
    margin-bottom:15px;
}

.no-property a{
    display:inline-block;
    margin-top:20px;
    background:#E63946;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

footer{
    background:#050F1F;
    color:white;
    text-align:center;
    padding:40px 20px;
}

footer h2{
    color:#FFD700;
}

footer p{
    margin:12px 0;
    color:#ccc;
}

footer a{
    color:white;
    margin:6px;
    text-decoration:none;
}

@media(max-width:600px){

    header{
        justify-content:center;
        text-align:center;
    }

    nav{
        justify-content:center;
    }

    nav a{
        font-size:13px;
        padding:8px;
    }

    .container{
        margin:25px auto;
    }

    .property-image{
        height:260px;
    }

    .content{
        padding:20px;
    }

    h1{
        font-size:25px;
    }

    .price{
        font-size:23px;
    }

    .btn{
        width:100%;
        text-align:center;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
🇮🇳 BharatWorld
<small>PROPERTIES</small>
</div>

<nav>
<a href="index.html">Home</a>
<a href="buy.html">Buy</a>
<a href="sell.html">Sell</a>
<a href="rent.html">Rent</a>
<a href="interior.html">Interior</a>
<a href="listing.html">Listing</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
</nav>

</header>


<div class="container">

<a href="listing.html" class="back">
← Back to Listings
</a>

<div id="propertyArea"></div>

</div>


<footer>

<h2>🇮🇳 BharatWorld Properties</h2>

<p>From Bharat to the World.</p>

<p>Buy • Sell • Rent • Interior</p>

<p>
<a href="index.html">Home</a>
<a href="buy.html">Buy</a>
<a href="sell.html">Sell</a>
<a href="rent.html">Rent</a>
<a href="interior.html">Interior</a>
<a href="listing.html">Listing</a>
<a href="contact.html">Contact</a>
</p>

<p style="color:#aaa;">
© 2026 BharatWorld Properties. All Rights Reserved.
</p>

</footer>


<script>

function loadProperty(){

    const saved =
    localStorage.getItem("pv_selected_property");

    const area =
    document.getElementById("propertyArea");

    if(!saved){

        area.innerHTML = `
        <div class="no-property">

            <h2>🏠 Property Not Found</h2>

            <p>
            Please select a property from the listing page.
            </p>

            <a href="listing.html">
            View Property Listings
            </a>

        </div>
        `;

        return;
    }

    const property =
    JSON.parse(saved);

    let image =
    property.image || 
    "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80";

    let phone =
    property.phone || "+919999999999";

    area.innerHTML = `

    <div class="property-box">

        <img
        class="property-image"
        src="${image}"
        alt="${property.title || "Property"}"
        >

        <div class="content">

            <span class="verified">
            ✓ VERIFIED PROPERTY
            </span>

            <h1>
            ${property.title || "Property"}
            </h1>

            <div class="price">
            ₹${property.price || "Contact for Price"}
            </div>

            <div class="info">

                📍 ${property.city || "India"}<br>

                🏢 ${property.type || "Property"}<br>

                🛏 ${property.bhk || "Details available"}<br>

                🏷️ ${property.purpose || "Property Listing"}

            </div>

            <div class="description">

                <h2>
                Property Description
                </h2>

                <p>
                ${property.description ||
                "This property is listed on BharatWorld Properties. Contact the property owner or representative for complete details, availability and site visit information."}
                </p>

            </div>

            <div class="actions">

                <a
                href="tel:${phone}"
                class="btn call">

                📞 Call Owner

                </a>

                <a
                href="https://wa.me/${phone.replace(/\D/g,'')}"
                class="btn whatsapp">

                💬 WhatsApp

                </a>

                <a
                href="listing.html"
                class="btn back-list">

                ← More Properties

                </a>

            </div>

        </div>

    </div>

    `;

}

loadProperty();

</script>

</body>
    </html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Property Details | BharatWorld Properties</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#081B33;
}

/* HEADER */

header{
    background:#081B33;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

.logo{
    color:#FFD700;
    font-size:24px;
    font-weight:bold;
}

.logo small{
    display:block;
    color:white;
    font-size:10px;
    letter-spacing:2px;
    margin-top:3px;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:7px;
}

.back:hover{
    background:#E63946;
}

/* MAIN */

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px 60px;
}

/* PROPERTY */

.property-box{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    display:flex;
    flex-wrap:wrap;
}

.image-section{
    width:50%;
    min-width:320px;
}

.image-section img{
    width:100%;
    height:100%;
    min-height:420px;
    object-fit:cover;
}

.details-section{
    flex:1;
    padding:35px;
    min-width:320px;
}

.badge{
    display:inline-block;
    background:#e7f8ed;
    color:#16803c;
    padding:7px 11px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

.details-section h1{
    font-size:34px;
    margin-bottom:15px;
}

.price{
    font-size:30px;
    font-weight:bold;
    color:#E63946;
    margin-bottom:20px;
}

.location{
    color:#666;
    font-size:17px;
    margin-bottom:25px;
}

/* INFO */

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:25px;
}

.info-item{
    background:#f5f7fa;
    padding:15px;
    border-radius:10px;
}

.info-item strong{
    display:block;
    margin-bottom:5px;
}

/* DESCRIPTION */

.description{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.description h2{
    margin-bottom:10px;
    font-size:21px;
}

.description p{
    color:#666;
    line-height:1.7;
}

/* OWNER */

.owner-box{
    background:#fff8e1;
    margin-top:25px;
    padding:18px;
    border-radius:10px;
}

.owner-box h3{
    margin-bottom:8px;
}

/* BUTTONS */

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:25px;
}

.btn{
    display:inline-block;
    padding:13px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    text-align:center;
    border:0;
    cursor:pointer;
    font-size:15px;
}

.call{
    background:#E63946;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.listing{
    background:#081B33;
    color:white;
}

.enquiry-btn{
    background:#FFD700;
    color:#081B33;
}

/* ENQUIRY BOX */

.enquiry-box{
    background:white;
    margin-top:25px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.enquiry-box h2{
    margin-bottom:8px;
}

.enquiry-subtitle{
    color:#666;
    margin-bottom:20px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.field input,
.field textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.field input:focus,
.field textarea:focus{
    border-color:#E63946;
}

.field textarea{
    min-height:110px;
    resize:vertical;
}

.send-btn{
    width:100%;
    background:#E63946;
    color:white;
    border:0;
    padding:15px;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.send-btn:hover{
    background:#c92f3b;
}

.success-message{
    display:none;
    background:#e7f8ed;
    color:#16803c;
    padding:14px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}

/* NOT FOUND */

.not-found{
    background:white;
    max-width:600px;
    margin:80px auto;
    padding:40px 25px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.not-found h1{
    margin-bottom:15px;
}

.not-found p{
    color:#666;
    margin-bottom:25px;
}

/* FOOTER */

footer{
    background:#050F1F;
    color:white;
    text-align:center;
    padding:35px 20px;
}

footer h2{
    color:#FFD700;
}

footer p{
    color:#ccc;
    margin-top:10px;
}

/* MOBILE */

@media(max-width:700px){

    header{
        justify-content:center;
        text-align:center;
    }

    .property-box{
        display:block;
    }

    .image-section{
        width:100%;
        min-width:100%;
    }

    .image-section img{
        min-height:280px;
        height:280px;
    }

    .details-section{
        padding:25px 20px;
        min-width:100%;
    }

    .details-section h1{
        font-size:28px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">

🇮🇳 BharatWorld

<small>PROPERTIES</small>

</div>

<a href="listing.html" class="back">

← Back to Listings

</a>

</header>


<div id="propertyContainer"></div>


<footer>

<h2>🇮🇳 BharatWorld Properties</h2>

<p>
From Bharat to the World.
</p>

<p>
© 2026 BharatWorld Properties. All Rights Reserved.
</p>

</footer>


<script>

/* ============================== */
/* GET SELECTED PROPERTY */
/* ============================== */

const selectedProperty = JSON.parse(
    localStorage.getItem("pv_selected_property")
);


const container =
document.getElementById("propertyContainer");


/* ============================== */
/* PROPERTY NOT FOUND */
/* ============================== */

if(!selectedProperty){

    container.innerHTML = `

    <div class="not-found">

        <h1>🏠 Property Not Found</h1>

        <p>
        Please select a property from the listings page.
        </p>

        <a
        href="listing.html"
        class="btn listing">

        View Properties

        </a>

    </div>

    `;

}


/* ============================== */
/* SHOW PROPERTY */
/* ============================== */

else{

    const propertyImage =
    selectedProperty.image ||
    "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80";


    /* PRICE */

    let formattedPrice =
    selectedProperty.price;


    if(
        selectedProperty.price &&
        !String(selectedProperty.price).includes("₹")
    ){

        const numberPrice =
        Number(selectedProperty.price);


        if(!isNaN(numberPrice)){

            formattedPrice =
            "₹" +
            numberPrice.toLocaleString("en-IN");

        }

    }


    /* PROPERTY DATA */

    const title =
    selectedProperty.title ||
    "Property";


    const city =
    selectedProperty.city ||
    "Location not specified";


    const type =
    selectedProperty.type ||
    "Not specified";


    const bhk =
    selectedProperty.bhk ||
    "Not specified";


    const listingType =
    selectedProperty.listingType ||
    "For Sale";


    const area =
    selectedProperty.area ||
    "Not specified";


    const description =
    selectedProperty.description ||
    "No property description available.";


    const owner =
    selectedProperty.owner ||
    "Property Owner";


    const phone =
    String(
        selectedProperty.phone ||
        "9999999999"
    ).replace(/\D/g,"");


    /* ============================== */
    /* DISPLAY PAGE */
    /* ============================== */

    container.innerHTML = `

    <div class="container">


        <div class="property-box">


            <div class="image-section">

                <img
                src="${propertyImage}"
                alt="Property Image"

                onerror="
                this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80'
                "

                >

            </div>


            <div class="details-section">


                <span class="badge">
                ✓ PROPERTY LISTED
                </span>


                <h1>
                ${title}
                </h1>


                <div class="price">
                ${formattedPrice}
                </div>


                <div class="location">

                📍 ${city}

                </div>


                <div class="info-grid">


                    <div class="info-item">

                        <strong>
                        🏢 Property Type
                        </strong>

                        ${type}

                    </div>


                    <div class="info-item">

                        <strong>
                        🛏 BHK
                        </strong>

                        ${bhk}

                    </div>


                    <div class="info-item">

                        <strong>
                        📐 Area
                        </strong>

                        ${area}

                    </div>


                    <div class="info-item">

                        <strong>
                        🏷️ Listing Type
                        </strong>

                        ${listingType}

                    </div>


                </div>


                <div class="description">

                    <h2>
                    📝 Property Description
                    </h2>

                    <p>
                    ${description}
                    </p>

                </div>


                <div class="owner-box">

                    <h3>
                    👤 ${owner}
                    </h3>

                    <p>
                    📞 +91 ${phone}
                    </p>

                </div>


                <div class="buttons">


                    <a
                    href="tel:+91${phone}"
                    class="btn call">

                    📞 Call Now

                    </a>


                    <a
                    href="https://wa.me/91${phone}"
                    target="_blank"
                    class="btn whatsapp">

                    💬 WhatsApp

                    </a>


                    <button
                    onclick="showEnquiryForm()"
                    class="btn enquiry-btn">

                    📩 Send Enquiry

                    </button>


                    <a
                    href="listing.html"
                    class="btn listing">

                    ← All Listings

                    </a>


                </div>


            </div>


        </div>



        <!-- ENQUIRY FORM -->

        <div
        class="enquiry-box"
        id="enquiryBox"
        style="display:none;"
        >

            <h2>
            📩 Send Enquiry
            </h2>

            <p class="enquiry-subtitle">

            Interested in this property?
            Send your requirement to the property owner.

            </p>


            <div
            id="successMessage"
            class="success-message"
            >

            ✅ Enquiry sent successfully!

            </div>


            <form id="enquiryForm">


                <div class="field">

                    <label>
                    👤 Your Name
                    </label>

                    <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
                    required
                    >

                </div>


                <div class="field">

                    <label>
                    📞 Mobile Number
                    </label>

                    <input
                    type="tel"
                    id="customerPhone"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    required
                    >

                </div>


                <div class="field">

                    <label>
                    📝 Message
                    </label>

                    <textarea
                    id="customerMessage"
                    placeholder="I am interested in this property..."
                    required
                    ></textarea>

                </div>


                <button
                type="submit"
                class="send-btn">

                📩 Send Enquiry

                </button>


            </form>

        </div>


    </div>

    `;


    /* ============================== */
    /* SHOW ENQUIRY FORM */
    /* ============================== */

    window.showEnquiryForm =
    function(){

        const box =
        document.getElementById(
            "enquiryBox"
        );


        box.style.display =
        "block";


        box.scrollIntoView({
            behavior:"smooth"
        });

    };


    /* ============================== */
    /* SUBMIT ENQUIRY */
    /* ============================== */

    document
    .getElementById("enquiryForm")
    .addEventListener(
        "submit",
        function(e){

            e.preventDefault();


            const customerName =
            document
            .getElementById("customerName")
            .value
            .trim();


            const customerPhone =
            document
            .getElementById("customerPhone")
            .value
            .replace(/\D/g,"");


            const customerMessage =
            document
            .getElementById("customerMessage")
            .value
            .trim();


            /* PHONE VALIDATION */

            if(customerPhone.length !== 10){

                alert(
                "⚠️ Please enter a valid 10 digit mobile number."
                );

                return;

            }


            /* ============================== */
            /* CREATE ENQUIRY */
            /* ============================== */

            const enquiry = {

                id:
                "ENQ" +
                Date.now(),

                /* CUSTOMER */

                customerName:
                customerName,

                phone:
                customerPhone,

                message:
                customerMessage,


                /* PROPERTY */

                propertyId:
                selectedProperty.id,

                propertyTitle:
                selectedProperty.title,

                propertyCity:
                selectedProperty.city,


                /* IMPORTANT OWNER CONNECTION */

                ownerUser:
                selectedProperty.postedBy,


                /* DATE */

                createdAt:
                new Date().toLocaleString()

            };


            /* ============================== */
            /* GET OLD ENQUIRIES */
            /* ============================== */

            let enquiries =
            JSON.parse(

                localStorage.getItem(
                    "pv_enquiries"
                ) || "[]"

            );


            /* ============================== */
            /* SAVE NEW ENQUIRY */
            /* ============================== */

            enquiries.push(enquiry);


            localStorage.setItem(

                "pv_enquiries",

                JSON.stringify(
                    enquiries
                )

            );


            /* ============================== */
            /* SUCCESS */
            /* ============================== */

            document
            .getElementById(
                "successMessage"
            )
            .style.display =
            "block";


            document
            .getElementById(
                "enquiryForm"
            )
            .reset();


            alert(
            "✅ Enquiry sent successfully!"
            );


            /* HIDE FORM AFTER 2 SEC */

            setTimeout(
                function(){

                    document
                    .getElementById(
                        "enquiryBox"
                    )
                    .style.display =
                    "none";

                },
                2500
            );

        }
    );

}

</script>


</body>

</html>

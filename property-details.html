```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Property Details | BharatWorld Properties</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#081B33;
}

header{
    background:#081B33;
    color:white;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

.logo{
    color:#FFD700;
    font-size:25px;
    font-weight:bold;
}

.logo small{
    display:block;
    color:white;
    font-size:10px;
    letter-spacing:2px;
    margin-top:3px;
}

nav{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:9px 11px;
    border-radius:6px;
}

nav a:hover{
    background:#E63946;
}

.container{
    max-width:1000px;
    margin:35px auto;
    padding:0 20px 60px;
}

.property-box{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 7px 25px rgba(0,0,0,.12);
}

.property-image{
    width:100%;
    height:420px;
    object-fit:cover;
}

.content{
    padding:30px;
}

.verified{
    display:inline-block;
    background:#e7f8ed;
    color:#16803c;
    padding:7px 10px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
}

h1{
    font-size:34px;
    margin:15px 0 10px;
}

.price{
    color:#E63946;
    font-size:28px;
    font-weight:bold;
    margin:10px 0;
}

.location{
    color:#555;
    font-size:17px;
    margin-bottom:25px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:25px 0;
}

.info{
    background:#f5f7fa;
    padding:18px;
    border-radius:10px;
    text-align:center;
}

.info strong{
    display:block;
    margin-top:6px;
}

.description{
    margin-top:25px;
    line-height:1.7;
    color:#555;
}

.owner{
    margin-top:30px;
    background:#f5f7fa;
    padding:22px;
    border-radius:12px;
}

.owner h2{
    margin-bottom:12px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn{
    flex:1;
    min-width:140px;
    text-align:center;
    padding:14px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.call{
    background:#081B33;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.back{
    background:#E63946;
    color:white;
}

.no-property{
    background:white;
    padding:50px 25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.no-property h2{
    margin-bottom:15px;
}

.no-property a{
    display:inline-block;
    margin-top:20px;
    background:#E63946;
    color:white;
    padding:13px 22px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

footer{
    background:#050F1F;
    color:white;
    text-align:center;
    padding:35px 20px;
}

footer h2{
    color:#FFD700;
}

footer p{
    color:#ccc;
    margin:12px 0;
}

footer a{
    color:white;
    margin:7px;
    text-decoration:none;
}

@media(max-width:600px){

    header{
        justify-content:center;
        text-align:center;
    }

    nav{
        justify-content:center;
    }

    nav a{
        font-size:13px;
        padding:8px;
    }

    .property-image{
        height:260px;
    }

    .content{
        padding:20px;
    }

    h1{
        font-size:27px;
    }

    .price{
        font-size:24px;
    }

    .info-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .btn{
        width:100%;
        flex:none;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
🏠 BharatWorld
<small>PROPERTIES</small>
</div>

<nav>
<a href="index.html">Home</a>
<a href="buy.html">Buy</a>
<a href="sell.html">Sell</a>
<a href="rent.html">Rent</a>
<a href="interior.html">Interior</a>
<a href="listing.html">Listing</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
</nav>

</header>


<div class="container">

<div id="propertyDetails"></div>

</div>


<footer>

<h2>🏠 BharatWorld Properties</h2>

<p>From Bharat to the World.</p>

<p>
<a href="index.html">Home</a>
<a href="buy.html">Buy</a>
<a href="sell.html">Sell</a>
<a href="rent.html">Rent</a>
<a href="listing.html">Listing</a>
<a href="contact.html">Contact</a>
</p>

<p>
© 2026 BharatWorld Properties. All Rights Reserved.
</p>

</footer>


<script>

let properties =
JSON.parse(localStorage.getItem("pv_properties") || "[]");

let box =
document.getElementById("propertyDetails");


if(properties.length === 0){

    box.innerHTML = `
    <div class="no-property">

        <h2>🏠 No Property Found</h2>

        <p>
        Please post a property first to view its details.
        </p>

        <a href="sell.html">
        ➕ Post Your Property
        </a>

    </div>
    `;

}else{

    /*
      Demo version:
      Latest posted property will be shown.
    */

    let property =
    properties[properties.length - 1];


    let cleanPhone =
    String(property.phone || "")
    .replace(/\D/g,"");


    let priceText =
    property.listingType === "For Rent"
    ? "₹" + property.price + " / Month"
    : "₹" + property.price;


    box.innerHTML = `

    <div class="property-box">

        <img
        class="property-image"
        src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80"
        alt="Property">

        <div class="content">

            <span class="verified">
            ✓ PROPERTY LISTED
            </span>

            <h1>
            ${property.title}
            </h1>

            <div class="price">
            ${priceText}
            </div>

            <div class="location">
            📍 ${property.city}
            </div>


            <div class="info-grid">

                <div class="info">
                    🏢
                    <strong>${property.type}</strong>
                </div>

                <div class="info">
                    🛏
                    <strong>${property.bhk}</strong>
                </div>

                <div class="info">
                    📐
                    <strong>${property.area || "Not provided"}</strong>
                </div>

                <div class="info">
                    🏷️
                    <strong>${property.listingType}</strong>
                </div>

            </div>


            <div class="description">

                <h2>📝 Property Description</h2>

                <p style="margin-top:10px;">
                ${property.description}
                </p>

            </div>


            <div class="owner">

                <h2>👤 Owner Information</h2>

                <p>
                <strong>Name:</strong>
                ${property.owner || "Not provided"}
                </p>

                <p style="margin-top:8px;">
                <strong>Phone:</strong>
                ${property.phone || "Not provided"}
                </p>

            </div>


            <div class="buttons">

                <a
                href="tel:${cleanPhone}"
                class="btn call">

                📞 Call Owner

                </a>


                <a
                href="https://wa.me/${cleanPhone}"
                class="btn whatsapp">

                💬 WhatsApp

                </a>


                <a
                href="listing.html"
                class="btn back">

                ← Back to Listings

                </a>

            </div>

        </div>

    </div>

    `;

}

</script>

</body>
</html>
```

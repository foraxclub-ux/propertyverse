<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Property Details | BharatWorld Properties</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#081B33;
}

/* HEADER */

header{
    background:#081B33;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

.logo{
    color:#FFD700;
    font-size:25px;
    font-weight:bold;
}

.logo small{
    display:block;
    color:white;
    font-size:10px;
    letter-spacing:2px;
    margin-top:3px;
}

nav{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:9px 11px;
    border-radius:6px;
}

nav a:hover{
    background:#E63946;
}

/* PROPERTY */

.container{
    max-width:1000px;
    margin:45px auto;
    padding:0 20px;
}

.property-box{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.property-image{
    width:100%;
    height:380px;
    object-fit:cover;
    background:#ddd;
}

.property-content{
    padding:30px;
}

.badge{
    display:inline-block;
    background:#e7f8ed;
    color:#16803c;
    padding:7px 12px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

h1{
    font-size:35px;
    margin-bottom:15px;
}

.price{
    color:#E63946;
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
}

.info{
    background:#f5f7fa;
    padding:20px;
    border-radius:10px;
    line-height:2;
    color:#555;
}

.description{
    margin-top:25px;
}

.description h2{
    margin-bottom:10px;
}

.owner-box{
    margin-top:25px;
    background:#081B33;
    color:white;
    padding:22px;
    border-radius:12px;
}

.owner-box h2{
    color:#FFD700;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
}

.btn{
    display:inline-block;
    padding:14px 22px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.call{
    background:#081B33;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.back{
    background:#E63946;
    color:white;
}

/* ERROR */

.no-property{
    text-align:center;
    background:white;
    padding:50px 20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

/* FOOTER */

footer{
    background:#050F1F;
    color:white;
    text-align:center;
    padding:35px 20px;
    margin-top:60px;
}

footer h2{
    color:#FFD700;
}

footer p{
    color:#ccc;
    margin:12px 0;
}

footer a{
    color:white;
    margin:7px;
    text-decoration:none;
}

/* MOBILE */

@media(max-width:600px){

    header{
        justify-content:center;
        text-align:center;
    }

    nav{
        justify-content:center;
    }

    nav a{
        font-size:13px;
        padding:8px;
    }

    .property-image{
        height:240px;
    }

    .property-content{
        padding:20px;
    }

    h1{
        font-size:28px;
    }

    .price{
        font-size:25px;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        text-align:center;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
🏠 BharatWorld
<small>PROPERTIES</small>
</div>

<nav>
<a href="index.html">Home</a>
<a href="buy.html">Buy</a>
<a href="sell.html">Sell</a>
<a href="rent.html">Rent</a>
<a href="interior.html">Interior</a>
<a href="listing.html">Listing</a>
<a href="contact.html">Contact</a>
</nav>

</header>


<div class="container" id="propertyContainer">

<div class="no-property">

<h2>Loading Property...</h2>

<p style="margin-top:10px;">
Please wait.
</p>

</div>

</div>


<footer>

<h2>🏠 BharatWorld Properties</h2>

<p>From Bharat to the World.</p>

<p>
<a href="index.html">Home</a>
<a href="buy.html">Buy</a>
<a href="sell.html">Sell</a>
<a href="rent.html">Rent</a>
<a href="interior.html">Interior</a>
<a href="listing.html">Listing</a>
<a href="contact.html">Contact</a>
</p>

<p>
© 2026 BharatWorld Properties. All Rights Reserved.
</p>

</footer>


<script>

let property =
JSON.parse(
    localStorage.getItem(
        "pv_selected_property"
    ) || "null"
);

let container =
document.getElementById(
    "propertyContainer"
);


if(property){

    let phone =
    property.phone || "";

    let whatsapp =
    phone.replace(/\D/g,"");

    container.innerHTML = `

    <div class="property-box">

        <img
        class="property-image"
        src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80"
        alt="Property Image">

        <div class="property-content">

            <span class="badge">
            ✓ PROPERTY VERIFIED
            </span>

            <h1>
            ${property.title || "Property"}
            </h1>

            <div class="price">
            ₹${property.price || "Contact for Price"}
            </div>

            <div class="info">

            📍 <strong>Location:</strong>
            ${property.city || "India"}
            <br>

            🏢 <strong>Property Type:</strong>
            ${property.type || "Property"}
            <br>

            🛏 <strong>BHK:</strong>
            ${property.bhk || "Details Available"}
            <br>

            🏷️ <strong>Listing:</strong>
            ${property.listingType || property.purpose || "Available"}

            </div>


            <div class="description">

                <h2>📝 Property Description</h2>

                <p>
                ${property.description || "Property details are available on request."}
                </p>

            </div>


            <div class="owner-box">

                <h2>👤 Owner / Contact Details</h2>

                <p>
                <strong>Name:</strong>
                ${property.owner || "Property Owner"}
                </p>

                <p style="margin-top:8px;">
                <strong>Phone:</strong>
                ${phone || "Contact details available on request"}
                </p>

            </div>


            <div class="buttons">

                ${
                phone
                ?
                `<a
                href="tel:${phone}"
                class="btn call">
                📞 Call Owner
                </a>`
                :
                ""
                }


                ${
                whatsapp
                ?
                `<a
                href="https://wa.me/91${whatsapp}"
                class="btn whatsapp"
                target="_blank">
                💬 WhatsApp
                </a>`
                :
                ""
                }


                <a
                href="listing.html"
                class="btn back">
                ← Back to Listings
                </a>

            </div>

        </div>

    </div>

    `;

}else{

    container.innerHTML = `

    <div class="no-property">

        <h2>❌ Property Not Found</h2>

        <p style="margin:15px 0;">
        Please select a property from the Listing page.
        </p>

        <a
        href="listing.html"
        class="btn back">

        ← Go to Listings

        </a>

    </div>

    `;

}

</script>

</body>
    </html>

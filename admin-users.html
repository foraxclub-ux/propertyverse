<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Users - BharatWorld Properties</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#10233f;
}

.header{
  background:#071a33;
  color:white;
  padding:22px 16px;
  text-align:center;
}

.header h1{
  color:#ffd400;
  font-size:28px;
}

.header p{
  margin-top:6px;
  color:#ddd;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#071a33;
  color:white;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:28px;
  color:#ffd400;
  margin-top:5px;
}

.user{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.user h3{
  margin-bottom:8px;
}

.user p{
  color:#555;
  margin:5px 0;
}

.delete{
  background:#e63946;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}

.logout{
  background:#071a33;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>🏠 BharatWorld</h1>
  <p>PROPERTIES — Admin Users</p>
</div>

<div class="container">

  <div class="card">
    <div class="title">👥 Registered Users</div>

    <div class="stats">
      <div class="stat">
        Total Users
        <b id="totalUsers">0</b>
      </div>

      <div class="stat">
        Active Users
        <b id="activeUsers">0</b>
      </div>

      <div class="stat">
        Saved Properties
        <b id="savedCount">0</b>
      </div>
    </div>

    <div id="usersList"></div>
  </div>

  <div class="card">
    <button class="logout" onclick="logout()">🚪 Admin Logout</button>
  </div>

</div>

<script>

/* ADMIN SECURITY CHECK */
if(localStorage.getItem("adminLoggedIn") !== "true"){
  window.location.href = "admin-login.html";
}


/* LOAD USERS */
function loadUsers(){

  let users = JSON.parse(
    localStorage.getItem("users") || "[]"
  );

  let saved = JSON.parse(
    localStorage.getItem("savedProperties") || "[]"
  );

  document.getElementById("totalUsers").innerText =
    users.length;

  document.getElementById("activeUsers").innerText =
    users.length;

  document.getElementById("savedCount").innerText =
    saved.length;

  const list =
    document.getElementById("usersList");

  if(users.length === 0){

    list.innerHTML =
      '<div class="empty">No registered users found.</div>';

    return;
  }

  list.innerHTML = "";

  users.forEach((user,index)=>{

    const name =
      user.name ||
      user.fullName ||
      "User";

    const email =
      user.email ||
      "Email not available";

    const mobile =
      user.mobile ||
      user.phone ||
      "Mobile not available";

    list.innerHTML += `

      <div class="user">

        <h3>👤 ${name}</h3>

        <p>📧 ${email}</p>

        <p>📱 ${mobile}</p>

        <button
          class="delete"
          onclick="deleteUser(${index})">
          🗑️ Delete User
        </button>

      </div>

    `;

  });

}


/* DELETE USER */
function deleteUser(index){

  if(!confirm("Delete this user permanently?")){
    return;
  }

  let users = JSON.parse(
    localStorage.getItem("users") || "[]"
  );

  users.splice(index,1);

  localStorage.setItem(
    "users",
    JSON.stringify(users)
  );

  loadUsers();
}


/* LOGOUT */
function logout(){

  localStorage.removeItem("adminLoggedIn");

  window.location.href =
    "admin-login.html";
}


loadUsers();

</script>

</body>
</html>

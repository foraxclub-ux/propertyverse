<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Property | BharatWorld Properties</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f4f6f9;
color:#081B33;
}

header{
background:#081B33;
padding:16px 20px;

display:flex;
justify-content:space-between;
align-items:center;

flex-wrap:wrap;
gap:15px;
}

.logo{
color:#FFD700;
font-size:24px;
font-weight:bold;
}

.logo small{
display:block;
color:white;
font-size:10px;
letter-spacing:2px;
margin-top:3px;
}

.home{
color:white;
text-decoration:none;
padding:9px 14px;
border-radius:6px;
}

.home:hover{
background:#E63946;
}

.container{
max-width:700px;
margin:30px auto;
padding:15px;
}

.form-box{
background:white;
padding:28px;
border-radius:16px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
}

h1{
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-top:18px;
margin-bottom:7px;
}

input,
select,
textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#E63946;
}

textarea{
height:110px;
resize:vertical;
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#E63946;
color:white;
border:0;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#c92f3b;
}

.message{
display:none;
margin-top:18px;
padding:12px;
border-radius:8px;
text-align:center;
font-weight:bold;
}

.success{
background:#e7f8ed;
color:#16803c;
}

.error{
background:#ffe8e8;
color:#c62828;
}

@media(max-width:600px){

header{
justify-content:center;
text-align:center;
}

.form-box{
padding:22px 18px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">

🏠 BharatWorld

<small>PROPERTIES</small>

</div>


<a href="dashboard.html" class="home">

← Dashboard

</a>

</header>



<div class="container">

<div class="form-box">


<h1>

🏠 Add Property

</h1>


<p class="subtitle">

List your property on BharatWorld Properties

</p>


<form id="propertyForm">


<label>

Property Title

</label>

<input
id="title"
type="text"
placeholder="Example: Premium 3 BHK House"
required
>


<label>

Property Type

</label>

<select
id="type"
required
>

<option value="">
Select Property Type
</option>

<option>
Apartment
</option>

<option>
House
</option>

<option>
Villa
</option>

<option>
Plot
</option>

<option>
Commercial
</option>

</select>



<label>

City

</label>

<input
id="city"
type="text"
placeholder="Example: Ahmedabad"
required
>


<label>

Price

</label>

<input
id="price"
type="number"
min="0"
placeholder="Example: 5000000"
required
>


<label>

BHK

</label>

<select id="bhk">

<option>
1 BHK
</option>

<option>
2 BHK
</option>

<option>
3 BHK
</option>

<option>
4 BHK
</option>

<option>
5+ BHK
</option>

<option>
Not Applicable
</option>

</select>



<label>

Property Image URL

</label>

<input
id="image"
type="url"
placeholder="Paste property image URL (optional)"
>



<label>

Owner / Agent Name

</label>

<input
id="owner"
type="text"
placeholder="Enter owner or agent name"
required
>



<label>

Contact Number

</label>

<input
id="phone"
type="tel"
placeholder="Enter 10 digit mobile number"
maxlength="10"
required
>



<label>

Description

</label>

<textarea
id="description"
placeholder="Describe your property"
></textarea>



<button
type="submit"
>

➕ Add Property

</button>


<div
id="message"
class="message"
>

</div>


</form>

</div>

</div>



<script>

/* Login Protection */

const isLoggedIn =
localStorage.getItem("pv_logged_in");


if(
isLoggedIn !== "true"
){

window.location.href =
"login.html";

}



/* Save Property */

document
.getElementById("propertyForm")
.addEventListener(
"submit",
function(event){

event.preventDefault();


const title =
document
.getElementById("title")
.value
.trim();


const type =
document
.getElementById("type")
.value;


const city =
document
.getElementById("city")
.value
.trim();


const price =
document
.getElementById("price")
.value;


const bhk =
document
.getElementById("bhk")
.value;


const image =
document
.getElementById("image")
.value
.trim();


const owner =
document
.getElementById("owner")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const description =
document
.getElementById("description")
.value
.trim();


const message =
document
.getElementById("message");


message.style.display =
"none";


if(
phone.length !== 10 ||
isNaN(phone)
){

message.className =
"message error";


message.innerText =
"❌ Please enter a valid 10 digit mobile number.";


message.style.display =
"block";


return;

}


const property = {

id: Date.now(),

title: title,

type: type,

city: city,

price: price,

bhk: bhk,

image: image,

owner: owner,

phone: phone,

description: description,

user:
localStorage.getItem(
"pv_current_user"
),

date:
new Date().toLocaleDateString()

};


let properties =

JSON.parse(
localStorage.getItem(
"pv_properties"
) || "[]"
);


properties.push(
property
);


localStorage.setItem(

"pv_properties",

JSON.stringify(
properties
)

);


message.className =
"message success";


message.innerText =
"✅ Property Added Successfully! Redirecting to dashboard...";


message.style.display =
"block";


setTimeout(
function(){

window.location.href =
"dashboard.html";

},
1200
);


}
);

</script>


</body>

</html>

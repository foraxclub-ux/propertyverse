<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login | BharatWorld Properties</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#081B33;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#081B33;
    font-size:28px;
}

.logo h1 span{
    color:#FFD700;
}

.logo p{
    margin-top:7px;
    color:#666;
    font-size:14px;
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h2{
    color:#081B33;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#333;
}

.form-group input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.form-group input:focus{
    border-color:#081B33;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#081B33;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#102d52;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:18px;
    text-decoration:none;
    color:#081B33;
    font-weight:bold;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    color:#E63946;
    min-height:20px;
}

.demo{
    margin-top:20px;
    padding:12px;
    background:#f4f6f9;
    border-radius:8px;
    text-align:center;
    font-size:13px;
    color:#555;
}

.demo b{
    color:#081B33;
}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">

<h1>
🏠 BharatWorld <span>Properties</span>
</h1>

<p>
From Bharat to the World
</p>

</div>


<div class="title">

<h2>👑 Admin Login</h2>

</div>


<form
id="adminLoginForm"
onsubmit="adminLogin(event)"
>


<div class="form-group">

<label>
📧 Admin Email
</label>

<input
type="email"
id="adminEmail"
placeholder="Enter admin email"
required
>

</div>


<div class="form-group">

<label>
🔑 Password
</label>

<input
type="password"
id="adminPassword"
placeholder="Enter admin password"
required
>

</div>


<button
type="submit"
class="login-btn"
>

🔐 Login to Admin Panel

</button>


</form>


<div
id="message"
class="message">
</div>


<div class="demo">

<b>Demo Admin Login</b>

<br><br>

Email:
admin@bharatworldproperties.com

<br>

Password:
Admin@12345

</div>


<a
href="index.html"
class="back-btn">

🏠 Back to Website

</a>


</div>


<script>


function adminLogin(event){

event.preventDefault();


const email =
document.getElementById("adminEmail")
.value
.trim();


const password =
document.getElementById("adminPassword")
.value;


const message =
document.getElementById("message");


/* ADMIN CREDENTIALS */

const ADMIN_EMAIL =
"admin@bharatworldproperties.com";

const ADMIN_PASSWORD =
"Admin@12345";


/* CHECK LOGIN */

if(
email === ADMIN_EMAIL &&
password === ADMIN_PASSWORD
){

/*
   IMPORTANT:
   Same key used by admin.html
*/

localStorage.setItem(
"adminLoggedIn",
"true"
);


/* Keep compatibility with older admin pages */

localStorage.setItem(
"pv_admin",
"true"
);


message.style.color =
"#16803c";

message.innerText =
"✅ Login successful. Opening Admin Panel...";


setTimeout(function(){

window.location.href =
"admin.html";

},700);


}
else{

message.style.color =
"#E63946";

message.innerText =
"❌ Invalid admin email or password.";

}

}

</script>


</body>

</html>
